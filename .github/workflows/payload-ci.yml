# Safety net for the Payload school sites (payload/ folder).
# On every pull request and every push to main it:
#   1. type-checks the code,
#   2. fails if a database change was made without its migration,
#   3. fails if the generated types are out of date,
#   4. builds the site against a fresh, seeded database, starts it, and loads
#      every school's public pages plus the editor (scripts/smoke.mjs),
#   5. checks who can do what: roles, invites, publishing (scripts/permissions.mjs),
#   6. checks the school features: announcements, calendar + feeds, news
#      categories, drag ordering, page templates, video links (scripts/features.mjs),
#   7. checks what search engines get: descriptions, sitemap, robots, the
#      calendar limit, site icons, the one-H1 rule (scripts/seo.mjs, check-seo-helpers.ts),
#   8. checks the MCP connector: keys, drafts only, no deletes (scripts/mcp.mjs),
#   9. checks two-factor sign-in, optional for school staff and then (server
#      restarted as on the live site) required for Banner 61 admins (scripts/two-factor.mjs).
# Vercel still deploys main on its own; a red check here means look before you trust that deploy.
name: Payload checks

on:
  pull_request:
    paths: ['payload/**', '.github/workflows/payload-ci.yml']
  push:
    branches: [main]
    paths: ['payload/**', '.github/workflows/payload-ci.yml']

concurrency:
  group: payload-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: payload
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: b61
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/b61
      SCHOOL_SECRET: ci-only-not-a-real-secret
      SEED_DEMO: 'true'
      # Emails are saved here as files (no Resend key in CI); the permissions test reads invites from it.
      EMAIL_PREVIEW_DIR: /tmp/emails
      NEXT_TELEMETRY_DISABLED: '1'
      # IndexNow pings go to the SEO test's own stand-in server, never to Bing.
      INDEXNOW_ENABLED: 'true'
      INDEXNOW_ENDPOINT: http://localhost:8766/indexnow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: payload/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Migrations exist for every database change
        run: |
          npm run migrate:create -- ci_drift_check --skip-empty
          if ls src/migrations | grep -q ci_drift_check; then
            echo "::error::The collections changed but no migration was created. Run: npm run migrate:create <name>"
            exit 1
          fi

      - name: Generated types are up to date
        env:
          BLOB_READ_WRITE_TOKEN: vercel_blob_rw_schemaonly_x
        run: |
          npm run generate:types
          if ! git diff --quiet -- src/payload-types.ts; then
            echo "::error::src/payload-types.ts is out of date. Run: BLOB_READ_WRITE_TOKEN=vercel_blob_rw_schemaonly_x npm run generate:types"
            git diff --stat -- src/payload-types.ts
            exit 1
          fi

      - name: Migrate and seed the demo schools
        run: |
          npx payload migrate
          npx payload run src/scripts/seed.ts

      - name: Build
        run: npm run build

      - name: Start the site
        run: |
          mkdir -p /tmp/emails
          nohup npm start > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin/login | grep -q 200; then exit 0; fi
            sleep 2
          done
          echo "::error::The site did not start"; cat /tmp/server.log; exit 1

      - name: Smoke test (every school's pages + the editor)
        env:
          BASE_URL: http://localhost:3000
          SMOKE_EMAIL: ci@example.com
          SMOKE_PASSWORD: ci-smoke-password-123
        run: node scripts/smoke.mjs

      - name: Permissions test (roles, invites, publishing)
        env:
          BASE_URL: http://localhost:3000
          SMOKE_EMAIL: ci@example.com
          SMOKE_PASSWORD: ci-smoke-password-123
        run: |
          node scripts/permissions.mjs
          npx payload run src/scripts/check-publish-button.ts

      - name: School features test (announcements, calendar, templates)
        env:
          BASE_URL: http://localhost:3000
          SMOKE_EMAIL: ci@example.com
          SMOKE_PASSWORD: ci-smoke-password-123
        run: node scripts/features.mjs

      - name: Click-to-field test (live preview, in a real browser)
        env:
          BASE_URL: http://localhost:3000
          SMOKE_EMAIL: ci@example.com
          SMOKE_PASSWORD: ci-smoke-password-123
        run: |
          npx playwright install --with-deps chromium
          node scripts/click-to-field.mjs

      - name: SEO test (descriptions, sitemap, robots, icons, headings)
        env:
          BASE_URL: http://localhost:3000
          SMOKE_EMAIL: ci@example.com
          SMOKE_PASSWORD: ci-smoke-password-123
        run: |
          npx payload run src/scripts/check-seo-helpers.ts
          node scripts/seo.mjs

      - name: MCP connector test (keys, drafts only, no deletes)
        env:
          BASE_URL: http://localhost:3000
          SMOKE_EMAIL: ci@example.com
          SMOKE_PASSWORD: ci-smoke-password-123
        run: node scripts/mcp.mjs

      - name: Two-factor test (optional for school staff)
        env:
          BASE_URL: http://localhost:3000
          SMOKE_EMAIL: ci@example.com
          SMOKE_PASSWORD: ci-smoke-password-123
        run: node scripts/two-factor.mjs

      # Last: it sets up two-factor on the CI admin, so later password-only sign-ins would be held at the code page.
      - name: Two-factor test (required for Banner 61 admins, as on the live site)
        env:
          BASE_URL: http://localhost:3000
          SMOKE_EMAIL: ci@example.com
          SMOKE_PASSWORD: ci-smoke-password-123
          REQUIRED: 'true'
        run: |
          pkill -f "next-server|next start|scripts/start.mjs" || true
          for i in $(seq 1 15); do curl -s -o /dev/null http://localhost:3000/ || break; sleep 1; done
          mkdir -p /tmp/emails
          B61_REQUIRE_ADMIN_2FA=true nohup npm start > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/admin/login | grep -q 200; then break; fi
            sleep 2
          done
          node scripts/two-factor.mjs

      - name: Server log
        if: failure()
        run: tail -200 /tmp/server.log || true
